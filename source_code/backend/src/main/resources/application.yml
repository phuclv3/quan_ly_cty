# ════════════════════════════════════════════════════════════════════
# App Oxy backend — cấu hình chung. Mọi bí mật lấy từ biến môi trường
# (xem .env.example); KHÔNG ghi mật khẩu thật vào tệp này.
# ════════════════════════════════════════════════════════════════════
server:
  port: ${SERVER_PORT:1997}
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    encoding:
      charset: UTF-8
      force: true
  forward-headers-strategy: framework

spring:
  application:
    name: app-oxy-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://103.176.178.73:3306/oxymecie?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC}
    username: ${DB_USERNAME:oxymecie}
    password: ${DB_PASSWORD:nXeTnknKXJW6khkY}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý — Hibernate không tạo / xoá bảng.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        default_batch_fetch_size: 200
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    time-zone: UTC

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    # Địa chỉ frontend được gọi API (phân tách dấu phẩy).
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:4200}
  storage:
    # Thư mục lưu nội dung tệp hồ sơ (cần sao lưu cùng database).
    dir: ${APP_STORAGE_DIR:./data/files}
  security:
    swagger-public: ${APP_SWAGGER_PUBLIC:true}
  bootstrap:
    admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  dev:
    # Cho phép POST /api/admin/nap-lai-du-lieu-mau (xoá sạch & nạp lại dữ liệu mẫu). CHỈ bật ở môi trường phát triển.
    reset-enabled: false

logging:
  level:
    root: INFO
    vn.oxymecie.appoxy: INFO
    org.hibernate.SQL: WARN

---
# ════════════════════════════════════════════════════════════════════
# Hồ sơ "dev": nạp thêm dữ liệu mẫu (db/dev) và cho phép nạp lại dữ liệu mẫu từ màn Cấu hình.
# Chạy: SPRING_PROFILES_ACTIVE=dev
# ════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/dev
    # Chỉ hồ sơ dev mới được phép clean (dùng cho "Nạp lại dữ liệu mẫu").
    clean-disabled: false

app:
  dev:
    reset-enabled: true

logging:
  level:
    vn.oxymecie.appoxy: DEBUG
